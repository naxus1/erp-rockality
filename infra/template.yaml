AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ERP Rockality — Infraestructura serverless de bajo costo.
  Frontend (S3 + CloudFront) -> API Gateway -> Lambda (Express) -> PostgreSQL (Neon).
  Auth con Cognito. Secreto de cifrado en Secrets Manager.
  La base de datos es Neon (Postgres serverless externo): la Lambda ya NO usa VPC
  ni EFS; sale a internet (por defecto) para conectarse a Neon vía TLS.
  Diseñado para ~2-10 usuarios internos.

# ─────────────────────────────────────────────────────────────
# Parámetros (valores por ambiente en infra/parameters/*.json)
# ─────────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: prod
    Description: Ambiente de despliegue.
  BudgetEmail:
    Type: String
    Description: Email para recibir las alertas de presupuesto (50% y 100% de USD 10).
  AllowedOrigins:
    Type: String
    Description: Origen(es) permitido(s) para CORS (URL del frontend en CloudFront).
    Default: '*'
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: >
      Cadena de conexión de Neon (Postgres). Se inyecta como env var DATABASE_URL
      de la Lambda. NUNCA se guarda en el repo: la provee el CD desde un GitHub
      Secret (secrets.DATABASE_URL). Usar la connection string POOLED con
      sslmode=require.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 30

Resources:
  # ───────────────────────────────────────────────────────────
  # RED — La Lambda ya NO usa VPC ni EFS.
  # ───────────────────────────────────────────────────────────
  # Con la migración a Neon (Postgres externo) se eliminaron: la VPC, las
  # subredes privadas, los Security Groups (Lambda/EFS), el EFS (FileSystem,
  # MountTargets, AccessPoint) y el mount de la Lambda. La Lambda corre fuera de
  # VPC, por lo que tiene salida a internet nativa para conectarse a Neon vía TLS.
  # (El VPC Interface Endpoint de Secrets Manager ya se había eliminado antes.)

  # ───────────────────────────────────────────────────────────
  # SECRETS — Clave de cifrado de datos sensibles
  # ───────────────────────────────────────────────────────────
  EncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'rockality/${Stage}/encryption-key'
      Description: Clave AES-256 para cifrar email/telefono de clientes.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: false

  # ───────────────────────────────────────────────────────────
  # COGNITO — Autenticación
  # ───────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'rockality-${Stage}'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # self-signup DESHABILITADO
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      # MFA opcional por app autenticadora (TOTP). Sin SMS (evita config y costo).
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub 'rockality-${Stage}-web'
      GenerateSecret: false # SPA: sin client secret
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      # Sesión total de 3 horas: el refresh token vence a las 3h, así que al
      # expirar el idToken (60 min) se renueva mientras haya refresh válido, y
      # pasadas las 3h ya no se puede renovar -> se cierra la sesión.
      AccessTokenValidity: 60 # minutos
      IdTokenValidity: 60
      RefreshTokenValidity: 180 # minutos (3 horas)
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Acceso CRUD completo.

  GerenteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: gerente
      UserPoolId: !Ref UserPool
      Description: Acceso de solo lectura.

  # ───────────────────────────────────────────────────────────
  # LOGS — Retención corta para no acumular costo
  # ───────────────────────────────────────────────────────────
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/rockality-${Stage}-api'
      RetentionInDays: 14

  # ───────────────────────────────────────────────────────────
  # API — Lambda (Express) + API Gateway con Cognito Authorizer
  # ───────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # $default: sin prefijo de stage en el path (Express recibe /api/... limpio)
      StageName: $default
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigins]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      # Throttling para evitar facturas sorpresa
      DefaultRouteSettings:
        ThrottlingRateLimit: 100
        ThrottlingBurstLimit: 50
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
        # Por defecto exigimos JWT; el health check se abre explícitamente
        DefaultAuthorizer: CognitoAuth

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'rockality-${Stage}-api'
      Handler: dist/handler.handler
      CodeUri: ../backend/
      Architectures: [arm64] # Graviton: mas barato y evita cross-build en Mac ARM
      # Sin VpcConfig ni FileSystemConfigs: la Lambda corre fuera de VPC y se
      # conecta a Neon (Postgres externo) por internet vía TLS. Con Neon (que
      # tiene concurrencia real) ya NO es necesario reservar concurrencia = 1.
      Environment:
        Variables:
          NODE_ENV: production
          # Cadena de conexión de Neon. La provee el CD desde un GitHub Secret
          # (parámetro DatabaseUrl, NoEcho). No vive en el repo.
          DATABASE_URL: !Ref DatabaseUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          # La clave de cifrado se inyecta como env var resuelta por CloudFormation
          # desde Secrets Manager AL DESPLEGAR (dynamic reference). Así la Lambda
          # NO llama a Secrets Manager en runtime. El secreto sigue en Secrets Manager.
          ENCRYPTION_KEY: !Sub '{{resolve:secretsmanager:${EncryptionKeySecret}}}'
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_REGION: !Ref AWS::Region
      Events:
        HealthPublic:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE # health check público
        # Preflight CORS (OPTIONS): PÚBLICO, sin authorizer. El navegador envía
        # el preflight sin token, así que no debe exigir JWT. Express (cors)
        # responde 204 con los headers CORS.
        OptionsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ───────────────────────────────────────────────────────────
  # FRONTEND — S3 privado + CloudFront (OAC)
  # ───────────────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'rockality-${Stage}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'rockality-${Stage}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100 # solo NA/EU: más barato
        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https # HTTPS obligatorio
          # Managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
        # SPA: rutas de React devuelven index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true # TLS del dominio *.cloudfront.net
        Restrictions:
          GeoRestriction:
            RestrictionType: none

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ───────────────────────────────────────────────────────────
  # COSTOS — Budget con alertas al 50% y 100% de USD 10/mes
  # ───────────────────────────────────────────────────────────
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'rockality-${Stage}-budget'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 70
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

# BudgetEmail se declara aparte para no olvidarlo
Outputs:
  ApiUrl:
    Description: URL base del API (API Gateway, stage $default sin prefijo)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Description: URL del frontend (CloudFront)
    Value: !Sub 'https://${Distribution.DomainName}'
  FrontendBucketName:
    Description: Bucket S3 del frontend (para subir el build)
    Value: !Ref FrontendBucket
  UserPoolId:
    Description: Cognito User Pool ID (para VITE_COGNITO_USER_POOL_ID)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID (para VITE_COGNITO_CLIENT_ID)
    Value: !Ref UserPoolClient
  EncryptionKeySecretArn:
    Description: ARN del secreto con la clave de cifrado
    Value: !Ref EncryptionKeySecret
