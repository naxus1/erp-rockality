AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD — Usuario IAM de despliegue para GitHub Actions (ERP Rockality).
  Stack separado del de la app. Las access keys se generan aparte (CLI) y se
  guardan como GitHub Secrets.
  NOTA: se intentó OIDC (rol federado) pero la cuenta rechazaba el AssumeRole;
  se usa un usuario IAM dedicado con permisos de deploy. Ver LECCIONES_DEPLOY.md.

Resources:
  DeployUser:
    Type: AWS::IAM::User
    Properties:
      UserName: rockality-github-deploy
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudFrontFullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemFullAccess
        - arn:aws:iam::aws:policy/AmazonVPCFullAccess
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      Policies:
        - PolicyName: extras-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IamParaSAM
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: '*'
              - Sid: Budgets
                Effect: Allow
                Action:
                  - budgets:*
                Resource: '*'

Outputs:
  DeployUserName:
    Description: Usuario IAM para CI/CD. Generar access keys y guardarlas en GitHub Secrets.
    Value: !Ref DeployUser
