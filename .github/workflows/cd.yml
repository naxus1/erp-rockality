# ============================================
# CD Pipeline — Deploy a AWS (ERP Rockality)
# ============================================
# Se ejecuta al hacer merge/push a main. Despliega:
#  1. Backend + infraestructura (SAM -> CloudFormation stack rockality-prod)
#  2. Frontend (build -> S3 -> invalidación CloudFront)
#
# Autenticación: OIDC (sin llaves permanentes). GitHub asume el rol IAM
# rockality-github-deploy-oidc (creado por infra/cicd.yaml). El trust policy
# contempla el formato de "sub" inmutable de GitHub (owner_id/repo_id).
# ============================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  id-token: write # necesario para OIDC (emitir el token que asume el rol IAM)

env:
  AWS_REGION: us-east-1
  STACK_NAME: rockality-prod
  BUDGET_EMAIL: naxus1@gmail.com
  CLOUDFRONT_ORIGIN: https://d2a6va7cqw90db.cloudfront.net
  FRONTEND_BUCKET: rockality-prod-frontend-545860874640
  CLOUDFRONT_DIST_ID: E11ILNTFPG49JV

jobs:
  deploy:
    name: Deploy a AWS
    # Runner arm64 nativo: coincide con la Lambda (arm64). Con la migración a Neon
    # el backend usa `pg` (JavaScript puro, sin binarios nativos), así que el
    # `sam build` ya NO necesita contenedor.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (para SAM CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar SAM CLI
        run: pip install aws-sam-cli

      - name: Instalar dependencias
        run: npm ci

      # Credenciales vía OIDC (sin llaves permanentes): GitHub asume el rol IAM.
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545860874640:role/rockality-github-deploy-oidc
          aws-region: ${{ env.AWS_REGION }}

      # ── Backend + infraestructura ──
      - name: Build backend
        run: npm run build:backend

      # pg es JS puro: sam build sin --use-container (más rápido, sin Docker).
      - name: SAM build
        run: sam build -t infra/template.yaml

      - name: SAM deploy
        env:
          # Cadena de conexión de Neon (GitHub Secret). No vive en el repo.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sam deploy -t .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Stage=prod" \
              "BudgetEmail=$BUDGET_EMAIL" \
              "AllowedOrigins=$CLOUDFRONT_ORIGIN" \
              "DatabaseUrl=$DATABASE_URL"

      # ── Frontend ──
      - name: Build frontend
        run: npm run build:frontend

      - name: Subir frontend a S3
        run: aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/*"

      - name: Health check post-deploy
        run: |
          # Reintentos: tras el deploy la Lambda arranca en frío (resuelve la
          # clave de cifrado, conecta a Neon y aplica el esquema), damos margen.
          URL=https://gre6acehzf.execute-api.us-east-1.amazonaws.com/api/health
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.txt -w '%{http_code}' "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Deploy OK: API respondiendo (intento $i)"
              cat /tmp/health.txt
              exit 0
            fi
            echo "Intento $i: HTTP $code — reintentando en 10s..."
            cat /tmp/health.txt 2>/dev/null || true
            sleep 10
          done
          echo "Health check falló tras 10 intentos"
          exit 1
